<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode">
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --ink:#17231f;
  --muted:#738079;
  --green:#176b52;
  --green2:#e7f4ee;
  --line:#e7ece9;
  --paper:#f6f8f6;
  --white:#fff;
  --amber:#a96013;
  --red:#b64343;
  --shadow:0 10px 35px #193d2910
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:14px 'DM Sans',sans-serif
}
button,input,select {
  font:inherit
}
button {
  cursor:pointer
}
.shell {
  display:grid;
  grid-template-columns:246px 1fr;
  min-height:100vh
}
.side {
  background:#fff;
  border-right:1px solid var(--line);
  padding:25px 17px;
  display:flex;
  flex-direction:column;
  gap:24px
}
.brand {
  display:flex;
  align-items:center;
  gap:11px;
  padding:1px 8px 10px
}
.mark {
  width:39px;
  height:39px;
  border-radius:13px;
  background:var(--green);
  display:grid;
  place-items:center;
  color:#fff;
  font-size:18px
}
.brand strong {
  font:800 14px Manrope
}
.brand small {
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px
}
.navlabel {
  font-size:10px;
  letter-spacing:1.1px;
  font-weight:700;
  color:#9aa69f;
  padding:0 10px;
  margin:6px 0
}
.nav button {
  width:100%;
  border:0;
  background:transparent;
  color:#617068;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
  margin:2px 0;
  font-weight:600
}
.nav button:hover,.nav button.active {
  background:var(--green2);
  color:var(--green)
}
.userbox {
  margin-top:auto;
  border-top:1px solid var(--line);
  padding:15px 7px 0;
  display:flex;
  align-items:center;
  gap:10px
}
.avatar {
  width:35px;
  height:35px;
  background:#e8f1ec;
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--green);
  font-weight:800
}
.userbox span {
  flex:1
}
.userbox small {
  display:block;
  color:var(--muted);
  margin-top:3px
}
.main {
  min-width:0
}
.top {
  height:72px;
  background:#ffffffd9;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 34px;
  position:sticky;
  top:0;
  z-index:5;
  backdrop-filter:blur(12px)
}
.top small {
  color:var(--muted)
}
.top strong {
  display:block;
  font:700 13px Manrope;
  margin-top:3px
}
.content {
  max-width:1320px;
  margin:0 auto;
  padding:30px 34px 50px
}
.heading {
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:23px
}
.heading h1 {
  font:800 25px Manrope;
  margin:0 0 6px;
  letter-spacing:-.5px
}
.heading p {
  margin:0;
  color:var(--muted)
}
.grid {
  display:grid;
  gap:16px
}
.grid > * { min-width:0 }
.stats {
  grid-template-columns:repeat(4,minmax(0,1fr));
  margin-bottom:20px
}
.card {
  min-width:0;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:15px;
  padding:19px;
  box-shadow:var(--shadow)
}
.stathead {
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  font-weight:600
}
.icon {
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--green2);
  display:grid;
  place-items:center;
  color:var(--green)
}
.number {
  font:800 27px Manrope;
  margin-top:15px;
  letter-spacing:-.5px
}
.hint {
  font-size:11px;
  color:var(--muted);
  margin-top:4px
}
.layout {
  grid-template-columns:1.35fr .9fr
}
.attendance-pending {
  grid-column:1 / -1
}
.attendance-layout {
  grid-template-columns:1fr
}
.cardtitle {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}
.cardtitle h2 {
  font:700 15px Manrope;
  margin:0
}
.cardtitle span {
  font-size:12px;
  color:var(--muted)
}
.toolbar {
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:14px
}
.input,select {
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  color:var(--ink);
  outline:none;
  min-height:40px
}
.input:focus,select:focus {
  border-color:#86b7a0;
  box-shadow:0 0 0 3px #176b5212
}
input[type=date] {
  color:#56665e
}
.btn {
  border:0;
  border-radius:9px;
  padding:10px 14px;
  background:var(--green);
  color:white;
  font-weight:700
}
.btn:hover {
  background:#105840
}
.btn.secondary {
  background:#eef3f0;
  color:#315646
}
.btn.ghost {
  background:#fff;
  color:var(--green);
  border:1px solid #cbdcd2
}
.btn.danger {
  background:#fff0ee;
  color:var(--red)
}
.btn.small {
  padding:7px 10px;
  font-size:12px
}
.tablewrap {
  width:100%;
  min-width:0;
  max-height:785px;
  overflow:auto
}
.limited-list {
  max-height:330px;
  overflow-y:auto;
  overscroll-behavior:contain
}
.pending-scroll { max-height:980px; overflow-y:auto; overscroll-behavior:contain }
.check-row {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 4px;
  border-bottom:1px solid var(--line)
}
.check-row:last-child { border-bottom:0 }
.check-row input { accent-color:var(--green); width:17px; height:17px }
.check-header { color:#8a978f; font-size:10px; font-weight:700; letter-spacing:.75px; text-transform:uppercase }
.check-header span:nth-child(3) { width:176px }
.attendance-status { width:176px; flex:0 0 176px; padding:8px 9px }
table {
  width:100%;
  border-collapse:collapse;
  white-space:nowrap
}
th {
  text-align:left;
  color:#8a978f;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.75px;
  padding:10px 9px;
  border-bottom:1px solid var(--line)
}
td {
  height:50px;
  padding:11px 9px;
  border-bottom:1px solid #f0f3f1;
  font-size:12px
}
tr:last-child td {
  border-bottom:0
}
.person {
  font-weight:700
}
.sub {
  font-size:11px;
  color:var(--muted);
  margin-top:3px
}
.badge {
  display:inline-block;
  border-radius:20px;
  padding:5px 9px;
  font-size:10px;
  font-weight:700;
  background:#e8f4ed;
  color:#28734f
}
.badge.late {
  background:#fff2de;
  color:var(--amber)
}
.badge.absent {
  background:#f0f1f1;
  color:#68736d
}
.badge.sick {
  background:#eaf0ff;
  color:#4861a5
}
.badge.issue {
  background:#ffeded;
  color:var(--red)
}
.badge.missed { background:#f1eaff; color:#7049a3 }
.badge.absent-day { background:#edf0f2; color:#5f6870 }
.badge.excused { background:#e4f5f1; color:#167c69 }
.scanbox {
  background:#f8fbf9;
  border:1px dashed #bdd1c5;
  border-radius:12px;
  padding:16px;
  text-align:center
}
.scanbox p {
  color:var(--muted);
  font-size:12px;
  line-height:1.5
}
.scan-result {
  min-height:20px;
  color:var(--green);
  font-weight:700;
  margin:8px
}
.schedule {
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:1px solid var(--line);
  padding-top:14px;
  margin-top:17px
}
.schedule b {
  font:700 13px Manrope
}
.schedule span {
  color:var(--muted);
  font-size:11px
}
.hidden {
  display:none!important
}
.empty {
  text-align:center;
  color:var(--muted);
  padding:28px
}
.modalback {
  position:fixed;
  inset:0;
  background:#10251db3;
  z-index:10;
  display:grid;
  place-items:center;
  padding:20px
}
.modal {
  background:#fff;
  border-radius:16px;
  padding:23px;
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto
}
.modal h2 {
  font:700 17px Manrope;
  margin:0 0 17px
}
.formgrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}
.field label {
  display:block;
  font-size:11px;
  font-weight:700;
  color:#5c6c63;
  margin-bottom:6px
}
.field input,.field select {
  width:100%
}
.actions {
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px
}
.toast {
  position:fixed;
  right:22px;
  bottom:22px;
  background:#183b2d;
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  z-index:20;
  box-shadow:var(--shadow)
}
.loading-overlay {
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-items:center;
  background:#10251d66;
  backdrop-filter:blur(2px)
}
.loading-overlay[hidden] { display:none }
.loading-card {
  display:flex;
  align-items:center;
  gap:13px;
  padding:17px 21px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  box-shadow:var(--shadow);
  font-weight:700;
  color:var(--ink)
}
.loading-spinner {
  width:23px;
  height:23px;
  border:3px solid #dcebe3;
  border-top-color:var(--green);
  border-radius:50%;
  animation:loading-spin .75s linear infinite
}
@keyframes loading-spin { to { transform:rotate(360deg) } }
.loginwrap {
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:radial-gradient(ellipse at 10% 0,#e0f1e7,transparent 45%),var(--paper)
}
.login {
  width:min(420px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:30px;
  box-shadow:0 25px 75px #193d2918
}
.login h1 {
  font:800 22px Manrope;
  margin:21px 0 7px
}
.login>p {
  color:var(--muted);
  line-height:1.5;
  margin:0 0 22px
}
.login .field {
  margin:13px 0
}
.login .btn {
  width:100%;
  margin-top:8px
}
.login .brand {
  padding:0
}
.note {
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
  margin-top:15px
}
.qrgrid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  max-height:708px;
  overflow-y:auto;
  overscroll-behavior:contain
}
.qritem {
  border:1px solid var(--line);
  border-radius:12px;
  padding:13px;
  text-align:center
}
.qritem canvas,.qritem img {
  margin:8px auto
}
.qritem b {
  display:block;
  font-size:12px
}
.qritem small {
  color:var(--muted)
}
.qritem button {
  margin-top:8px
}
.mobilemenu {
  display:none
}
@media(max-width:900px) {
  .shell {
  grid-template-columns:1fr
}
.side {
  display:none;
  position:fixed;
  z-index:7;
  inset:0 auto 0 0;
  width:260px;
  box-shadow:0 0 0 100vmax #11281e55
}
.side.open {
  display:flex
}
.mobilemenu {
  display:inline-block
}
.top {
  padding:0 18px
}
.content {
  padding:23px 18px
}
.stats {
  grid-template-columns:repeat(2,1fr)
}
.stats .card {
  height:164px;
  display:flex;
  flex-direction:column
}
.stathead {
  height:42px;
  min-height:42px;
  align-items:flex-start;
  gap:7px
}
.stathead span {
  flex:1;
  min-width:0;
  line-height:1.25;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden
}
.stathead .icon { flex:0 0 34px }
.stats .number { margin-top:8px; line-height:1 }
.stats .hint { min-height:28px; line-height:1.3 }
.layout {
  grid-template-columns:1fr
}

}
@media(max-width:520px) {
  .stats {
  gap:9px
}
.card {
  padding:14px
}
.tablewrap table { min-width:680px }
.heading {
  align-items:flex-start;
  gap:10px;
  flex-direction:column
}
.heading h1 {
  font-size:22px
}
.formgrid {
  grid-template-columns:1fr
}
.top {
  height:62px
}
.attendance-status { width:142px; flex-basis:142px; font-size:12px }
.qrgrid { grid-template-columns:repeat(2,minmax(0,1fr)); max-height:1416px }

}
</style>
</head>
<body>
<div id="app">
</div>
<div id="loadingoverlay" class="loading-overlay" role="status" aria-live="polite" hidden>
<div class="loading-card"><span class="loading-spinner" aria-hidden="true"></span><span id="loadingmessage">Sedang memproses data…</span></div>
</div>
<script>
const $ = selector => document.querySelector(selector);
const ATTENDANCE_STATUS_OPTIONS = [
  { value: 'Hadir', label: 'Hadir' },
  { value: 'Terlambat', label: 'Terlambat' },
  { value: 'Sakit', label: 'Sakit' },
  { value: 'Izin', label: 'Izin' },
  { value: 'Tidak sholat', label: 'Tidak Sholat' },
  { value: 'Di luar jadwal', label: 'Di Luar Jadwal' },
  { value: 'Tidak Masuk', label: 'Tidak Masuk' },
  { value: 'Berhalangan', label: 'Berhalangan' }
];
let state = {
  token: sessionStorage.getItem('token') || '',
  data: null,
  tab: 'home',
  scanner: null,
  poller: null,
  polling: false,
  reportFilters: null,
  attendanceRecordSelected: new Set(),
  pendingPage: 1,
  reportRangeKey: '',
  reportRangeRows: null,
  reportPage: 1,
  students: [],
  selectedStudents: new Set(),
  attendanceSelected: new Set(),
  attendanceStatuses: new Map()
};

const SUBMISSION_CALLS = new Set([
  'bootstrapAdmin','login','logout','saveSettings','saveProfile','recordAttendanceBulk',
  'updateAttendanceStatusBulk','deleteAttendanceRecords','importStudents','deleteStudents','updateStudentsBulk','importTeachers',
  'recordAttendance','setStudentStatus','saveStudent','saveTeacher','updateTeacher','deleteTeacher','setTeacherActive','deleteStudent'
]);
const ATTENDANCE_SUBMISSION_CALLS = new Set([
  'recordAttendanceBulk','updateAttendanceStatusBulk','deleteAttendanceRecords','recordAttendance','setStudentStatus'
]);
let activeSubmissions=0, submissionTimer=null;

function showLoading(message) {
  const label=$('#loadingmessage');
  const overlay=$('#loadingoverlay');
  if(label)label.textContent=message;
  if(overlay)overlay.hidden=false;
}

function startSubmission(message='Sedang memproses data…') {
  activeSubmissions++;
  const label=$('#loadingmessage');
  if(label)label.textContent=message;
  if(activeSubmissions===1)submissionTimer=setTimeout(()=>{
    const overlay=$('#loadingoverlay');
    if(overlay)overlay.hidden=false;
  },180);
}

function finishSubmission() {
  activeSubmissions=Math.max(0,activeSubmissions-1);
  if(activeSubmissions===0) {
    if(submissionTimer)clearTimeout(submissionTimer);
    submissionTimer=null;
    const overlay=$('#loadingoverlay');
    if(overlay)overlay.hidden=true;
  }
}

function call(name, ...args) {
  const isSubmission=SUBMISSION_CALLS.has(name);
  if(isSubmission)startSubmission(ATTENDANCE_SUBMISSION_CALLS.has(name)
    ?'Sedang menyimpan data absensi'
    :'Sedang memproses data…');
  return new Promise((resolve, reject) => {
    try {
      google.script.run
        .withSuccessHandler(result=>{if(isSubmission)finishSubmission();resolve(result)})
        .withFailureHandler(error=>{if(isSubmission)finishSubmission();reject(new Error(error.message || error))})
        [name](...args);
    } catch(error) {
      if(isSubmission)finishSubmission();
      reject(new Error(error.message || error));
    }
  });
}

function esc(value) {
  const entities = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  };
  return String(value ?? '').replace(/[&<>"']/g, character => entities[character]);
}

function toast(message) {
  const element = document.createElement('div');
  element.className = 'toast';
  element.textContent = message;
  document.body.appendChild(element);
  setTimeout(() => element.remove(), 3200);
}

function fail(e) {
  toast(e.message || String(e));
  if ((e.message || '').includes('Sesi berakhir')) {
    sessionStorage.removeItem('token');
    state.token = '';
    renderLogin();
  }
}

async function init() {
  try {
    state.data = await call('getAppData', state.token);
    state.students = state.data.students;
    render();
  } catch (error) {
    if ((error.message || '').includes('Database')) {
      $('#app').innerHTML = `
        <div class="loginwrap">
          <div class="login">
            <div class="brand">
              <div class="mark">☾</div>
              <strong>ABSENSI DZUHUR<small>SMK Batik 1 Surakarta</small></strong>
            </div>
            <h1>Database belum disiapkan</h1>
            <p>Buka editor Apps Script, jalankan fungsi <b>setupDatabase()</b>, izinkan akses, lalu muat ulang aplikasi.</p>
          </div>
        </div>`;
    } else if (state.token) {
      sessionStorage.removeItem('token');
      state.token = '';
      return init();
    } else {
      try {
        const status = await call('getSetupState');
        if (!status.ready) {
          $('#app').innerHTML = `
            <div class="loginwrap">
              <div class="login">
                <div class="brand">
                  <div class="mark">☾</div>
                  <strong>ABSENSI DZUHUR<small>SMK Batik 1 Surakarta</small></strong>
                </div>
                <h1>Database belum disiapkan</h1>
                <p>Buka editor Apps Script dari spreadsheet, jalankan fungsi <b>setupDatabase()</b>, izinkan akses, lalu muat ulang aplikasi.</p>
              </div>
            </div>`;
          return;
        }
        renderLogin(!status.hasAdmin);
      } catch (setupError) {
        renderLogin();
      }
    }
  }
}

function renderLogin(bootstrap=false) {
  $('#app').innerHTML=`<div class="loginwrap">
<div class="login">
<div class="brand">
<div class="mark">☾</div>
<strong>ABSENSI DZUHUR<small>SMK Batik 1 Surakarta</small>
</strong>
</div>
<h1>${bootstrap?'Buat admin pertama':'Selamat datang'}</h1>
<p>${bootstrap?'Amankan akun admin untuk mengelola data dan pengaturan.':'Masuk untuk melanjutkan pengelolaan absensi sholat.'}</p>${bootstrap?'<div class="field"><label>NAMA ADMIN</label><input class="input" id="lname" placeholder="Nama lengkap"></div>':''}<div class="field">
<label>USERNAME</label>
<input class="input" id="username" autocomplete="username" placeholder="contoh: petugas">
</div>
<div class="field">
<label>PASSWORD</label>
<input class="input" id="password" type="password" autocomplete="current-password" placeholder="Minimal 8 karakter">
</div>
<button class="btn" id="loginbtn">${bootstrap?'Buat akun admin':'Masuk ke aplikasi'}</button>
<div class="note">Data absensi tersimpan pada spreadsheet <strong>LABORAN SMK BATIK 1 SURAKARTA</strong></div>
</div>
</div>`;
  $('#loginbtn').onclick=async()=> {
    const button=$('#loginbtn');
    const originalLabel=button.textContent;
    button.disabled=true;
    button.textContent=bootstrap?'Membuat akun…':'Memproses login…';
    startSubmission();
    try {
      const res=bootstrap?await call('bootstrapAdmin',$('#lname').value,$('#username').value,$('#password').value):await call('login',$('#username').value,$('#password').value);
      state.token=res.token;
      sessionStorage.setItem('token',state.token);
      showLoading('Sedang memuat halaman dashboard…');
      await init();
    } catch(e) {
      toast(e.message);
    } finally {
      finishSubmission();
      if(button.isConnected) {
        button.disabled=false;
        button.textContent=originalLabel;
      }
    }
  }
}

function render() {
  const d=state.data,admin=d.user.role==='admin';
  $('#app').innerHTML=`<div class="shell">
<aside class="side" id="side">
<div class="brand">
<div class="mark">☾</div>
<strong>ABSENSI DZUHUR<small>SMK Batik 1 Surakarta</small>
</strong>
</div>
<div class="nav">

function stat(label,num,hint,icon) {
  return `<div class="card">
<div class="stathead">
<span>${label}</span>
<i class="icon">${icon}</i>
</div>
<div class="number">${num}</div>
<div class="hint">${hint}</div>
</div>`
  }

function options(items) {
  return [...new Set(items.filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')
  }

function badge(s) {
  const classes={
    'Terlambat':'late',
    'Belum absen':'absent',
    'Sakit':'sick',
    'Izin':'excused',
    'Tidak sholat':'issue',
    'Di luar jadwal':'issue',
    'Tidak Masuk':'absent-day',
    'Berhalangan':'missed'
  };
  const cls=classes[s]||'';
  return `<span class="badge ${cls}">${esc(s)}</span>`
  }

function genderText(gender) {
  return gender || 'Belum diisi';
}

<table>
<thead>

    esc(r.name)
      }

      }

    badge(r.status)
      }

  </td>
  </tr>`:`<tr>${
    selectable?`<td>
<input type="checkbox" class="studentcheck" value="${esc(r.nisn)}" ${state.selectedStudents.has(String(r.nisn))?'checked':''}>
</td>`:''
      }
  <td>
  <span class="person">${
    esc(r.studentName||r.name)

    esc(r.nisn)

function pendingList(rows) {
  return rows.length?rows.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)">
<span>
<b>${esc(s.name)}</b>
<div class="sub">${esc(genderText(s.gender))} · ${esc(s.grade)} · ${esc(s.className)} · ${esc(s.nisn)}</div>
</span>
<button class="btn small secondary" onclick="quickStatus('${esc(s.nisn)}')">Pilih status</button>
</div>`).join(''):'<div class="empty">Semua siswa sudah memiliki catatan.</div>'
  }

function drawPending() {
  const d=state.data,q=($('#pendingsearch')?.value||'').toLowerCase(),major=$('#attendanceMajor')?.value||'',className=$('#attendanceClass')?.value||'',rows=d.students.filter(s=>!d.attendance.some(a=>String(a.nisn)===String(s.nisn))&&(`${s.name} ${s.nisn} ${s.className} ${s.major}`).toLowerCase().includes(q)&&(!major||s.major===major)&&(!className||s.className===className));
  if($('#pendinglist')) {
    $('#pendinglist').innerHTML=rows.length?`<div class="pending-scroll"><div class="check-row check-header"><span aria-hidden="true" style="width:17px"></span><span style="flex:1">Siswa</span><span>Status</span></div>${rows.map(s=>`<div class="check-row"><input type="checkbox" class="attendancecheck" aria-label="Pilih ${esc(s.name)} untuk disimpan" value="${esc(s.nisn)}" ${state.attendanceSelected.has(String(s.nisn))?'checked':''}><span style="flex:1;min-width:0"><b>${esc(s.name)}</b><div class="sub">${esc(genderText(s.gender))} · ${esc(s.grade)} · ${esc(s.className)} · ${esc(s.major)} · ${esc(s.nisn)}</div></span><select class="attendance-status input" aria-label="Status ${esc(s.name)}" data-nisn="${esc(s.nisn)}">${ATTENDANCE_STATUS_OPTIONS.map(status=>`<option value="${esc(status.value)}" ${((state.attendanceStatuses.get(String(s.nisn))||'Hadir')===status.value)?'selected':''}>${esc(status.label)}</option>`).join('')}</select></div>`).join('')}</div>`:'<div class="empty">Semua siswa pada filter ini sudah memiliki catatan.</div>';
    document.querySelectorAll('.attendancecheck').forEach(input=>input.onchange=()=>{input.checked?state.attendanceSelected.add(input.value):state.attendanceSelected.delete(input.value);updateBulkSelection()});
    document.querySelectorAll('.attendance-status').forEach(select=>select.onchange=()=>state.attendanceStatuses.set(select.dataset.nisn,select.value));
    $('#pendingcount').textContent=`${rows.length} siswa`;
    updateBulkSelection();
      }
}

function updateBulkSelection() {
  const count=$('#bulkselection');
  if(count)count.textContent=`${state.attendanceSelected.size} siswa dipilih`;
}

async function saveBulkAttendance() {
  const entries=[...state.attendanceSelected].map(nisn=>({nisn,status:state.attendanceStatuses.get(nisn)||'Hadir'}));
  if(!entries.length){toast('Pilih siswa dan status absensinya terlebih dahulu.');return;}
  const button=$('#savebulk');
  const status=$('#bulksavestatus');
  if(button){button.disabled=true;button.textContent='Menyimpan…';}
  if(status)status.textContent='Sedang menyimpan absensi terpilih. Mohon tunggu…';
  try {
    const result=await call('recordAttendanceBulk',state.token,entries);

function parseCSV(text, aliasMap) {
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/,1)[0]||'',delimiter=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];
  let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++) {
    const c=text[i];
    if(quoted) {
      if(c==='"'&&text[i+1]==='"') {
        cell+='"';
        i++
              } else if(c==='"')quoted=false;
      else cell+=c
          } else if(c==='"')quoted=true;
    else if(c===delimiter) {
      row.push(cell);
      cell=''
          } else if(c==='\n') {
      row.push(cell.replace(/\r$/,''));
      if(row.some(x=>x.trim()))rows.push(row);
      row=[];
      cell=''
          } else cell+=c
      }
  row.push(cell.replace(/\r$/,''));
  if(row.some(x=>x.trim()))rows.push(row);
  if(!rows.length)throw new Error('CSV kosong.');
  const headers=rows.shift().map(x=>x.trim().toLowerCase());
  const aliases=aliasMap|| {
    nisn:['nisn'],name:['nama','nama siswa','name'],grade:['tingkat','kelas tingkat','grade'],major:['jurusan','major'],className:['kelas','nama kelas','class'],gender:['jenis kelamin','jenis_kelamin','gender','jk']
      }
  ;
  const indexes= {
  }
  ;
  for(const key in aliases) {
    indexes[key]=headers.findIndex(h=>aliases[key].includes(h));
    if(indexes[key]<0)throw new Error(aliasMap?'Header CSV tidak sesuai format yang disediakan.':'Header CSV harus memuat: NISN, Nama, Tingkat, Jurusan, Kelas, Jenis Kelamin. Unduh format yang disediakan.')
      }
  return rows.map((r,i)=> {
    if(r.length!==headers.length)throw new Error(`Jumlah kolom pada baris ${i+2} tidak sesuai.`);const x= {
    }
    ;Object.keys(indexes).forEach(k=>x[k]=r[indexes[k]].trim());return x
      }
  )
  }

function startRealtimeRefresh() {
  if (state.poller) return;
  state.poller = setInterval(refreshRealtimeData, 60000);
}

async function refreshRealtimeData() {
  if (!state.token || !state.data || state.polling || document.hidden) return;

  state.polling = true;
  try {
    const previousAttendance = JSON.stringify(state.data.attendance);
    const previousStudents = JSON.stringify(state.students);
    const previousUsers = JSON.stringify(state.data.users);
    const previousDate = state.data.today;
    const next = await call('getAppData', state.token);
    const attendanceChanged = previousDate !== next.today ||
      previousAttendance !== JSON.stringify(next.attendance);
    const studentsChanged = previousStudents !== JSON.stringify(next.students);
    const usersChanged = previousUsers !== JSON.stringify(next.users);

    state.data = next;
    state.students = next.students;

    if (state.tab === 'home' && (attendanceChanged || studentsChanged)) {
      renderView();
    } else if (state.tab === 'attendance' && (attendanceChanged || studentsChanged)) {
      drawPending();
      const count = $('#todaycount');
      const records = $('#todayrecords');
      if (count) count.textContent = `${next.attendance.length} catatan`;
      if (records) {
        records.innerHTML = drawTodayRecords();
        bindTodayRecordChecks();
      }
    } else if (state.tab === 'students' && (studentsChanged || attendanceChanged)) {
      const majorFilter = $('#majorfilter');
      const selectedMajor = majorFilter?.value || '';
      const classFilter = $('#classfilter');
      const selectedClass = classFilter?.value || '';
      if (majorFilter) {
        majorFilter.innerHTML = `<option value="">Semua jurusan</option>${options(next.students.map(student => student.major))}`;
        majorFilter.value = selectedMajor;
      }
      if(classFilter){classFilter.innerHTML=`<option value="">Semua kelas</option>${options(next.students.map(student=>student.className))}`;classFilter.value=selectedClass}
      drawStudents();
    } else if (state.tab === 'reports' && state.reportFilters) {
      await loadReport(true);
    } else if (state.tab === 'qrcodes' && studentsChanged) {
      drawQR();
    } else if (state.tab === 'staff' && usersChanged) {
      renderView();
    }
  } catch (error) {
    if ((error.message || '').includes('Sesi berakhir')) fail(error);
  } finally {
    state.polling = false;
  }
}

async function scanQRPhoto(event) {
  const file = event.target.files?.[0];
  event.target.value = '';
  if (!file) return;

  if (!window.Html5Qrcode) {
    toast('Library pemindai QR belum termuat. Periksa koneksi internet lalu muat ulang halaman.');
    return;
  }

  const result = $('#scanresult');
  result.textContent = 'Membaca QR dari foto…';

  try {
    const scanner = new Html5Qrcode('reader');
    const nisn = await scanner.scanFile(file, true);
    scanner.clear();
    result.textContent = 'QR terbaca · menyimpan absensi…';
    await scan(nisn);
  } catch (error) {
    $('#reader').innerHTML = '';
    const message = 'QR tidak terbaca. Ambil foto lebih dekat, terang, dan tidak buram.';
    if (result) result.textContent = message;
    toast(message);
  }
}

async function loadReport(backgroundRefresh = false) {
  if (!backgroundRefresh) {
    state.reportFilters = {
      from: $('#from').value,
      to: $('#to').value,
      grade: $('#rgrade').value,
      major: $('#rmajor').value,
      className: $('#rclass').value,
      search: ($('#rsearch').value || '').trim().toLowerCase(),
      status: $('#rstatus').value
    };
  }

  const target=$('#reporttable');
  if(!backgroundRefresh&&state.tab==='reports'&&target)target.innerHTML='<div class="empty">Memuat data rekap…</div>';

  try {
    const filters = {...state.reportFilters};
    const rangeKey=`${filters.from}|${filters.to}`;
    if(backgroundRefresh||state.reportRangeKey!==rangeKey||!Array.isArray(state.reportRangeRows)) {
      const rangeRows=await call('getReport',state.token,{from:filters.from,to:filters.to});
      if(state.tab!=='reports'||!$('#reporttable'))return;
      if(`${state.reportFilters?.from}|${state.reportFilters?.to}`!==rangeKey)return;
      state.reportRangeRows=rangeRows;
      state.reportRangeKey=rangeKey;
    }
    const rows=state.reportRangeRows.filter(row=>(!filters.grade||String(row.grade)===String(filters.grade))&&(!filters.major||String(row.major)===String(filters.major))&&(!filters.className||String(row.className)===String(filters.className))&&(!filters.search||`${row.studentName} ${row.nisn}`.toLowerCase().includes(filters.search))&&(!filters.status||row.status===filters.status));
    const currentTarget=$('#reporttable');
    if(state.tab!=='reports'||!currentTarget||JSON.stringify(filters)!==JSON.stringify(state.reportFilters))return;
    state.report=rows;
    currentTarget.innerHTML=renderReportRows(rows);
    bindReportPagination();
      } catch(e) {
    if(state.tab==='reports') {
      const currentTarget=$('#reporttable');
      if(currentTarget)currentTarget.innerHTML='<div class="empty">Data rekap gagal dimuat. Silakan coba kembali.</div>';
      fail(e)
    }
      }
}

function buildTodayReportRows() {
  if(!state.data)return [];

    return {

     ${

<div class="toolbar" style="margin:0"><button class="btn secondary small" id="reportPrev" ${state.reportPage<=1?'disabled':''}>Sebelumnya</button><span class="sub">Halaman ${state.reportPage} dari ${totalPages}</span><button class="btn secondary small" id="reportNext" ${state.reportPage>=totalPages?'disabled':''}>Berikutnya</button></div>

function bindReportPagination() {
  const prev=$('#reportPrev'),next=$('#reportNext');
  if(prev)prev.onclick=()=>{if(state.reportPage>1){state.reportPage--;const target=$('#reporttable');target.innerHTML=renderReportRows(state.report);bindReportPagination()}};

}

async function downloadAttendanceCounts() {
  if (!window.ExcelJS || !window.Chart) {
    toast('Pustaka Excel atau grafik belum termuat. Periksa koneksi internet lalu coba kembali.');
    return;
  }

  const filters = {
    from: $('#from')?.value || state.data.today,
    to: $('#to')?.value || state.data.today,
    grade: $('#rgrade')?.value || '',
    major: $('#rmajor')?.value || '',
    className: $('#rclass')?.value || ''
  };
  const rangeKey = `${filters.from}|${filters.to}`;
  const downloadButton = $('#downloadcount');
  if (downloadButton) {
    downloadButton.disabled = true;
    downloadButton.textContent = 'Menyiapkan Excel…';
  }

  try {
    let reportRows = state.reportRangeRows;
    if (state.reportRangeKey !== rangeKey || !Array.isArray(reportRows)) {
      reportRows = await call('getReport', state.token, {from: filters.from, to: filters.to});
      if (state.reportFilters && `${state.reportFilters.from}|${state.reportFilters.to}` === rangeKey) {
        state.reportRangeRows = reportRows;
        state.reportRangeKey = rangeKey;
      }
    }

    const matchingStudents = state.students.filter(student =>
      (!filters.grade || String(student.grade) === String(filters.grade)) &&
      (!filters.major || String(student.major) === String(filters.major)) &&
      (!filters.className || String(student.className) === String(filters.className)) &&
      (!($('#rsearch')?.value || '').trim() || `${student.name} ${student.nisn}`.toLowerCase().includes(($('#rsearch').value || '').trim().toLowerCase()))
    );
    const statusColumns = [
      ['Hadir', 'Hadir'],
      ['Tidak sholat', 'Tidak Sholat'],
      ['Berhalangan', 'Berhalangan'],
      ['Tidak Masuk', 'Tidak Masuk'],
      ['Terlambat', 'Terlambat'],
      ['Izin', 'Izin'],
      ['Sakit', 'Sakit'],
      ['Di luar jadwal', 'Di Luar Jadwal']
    ];
    const headers = ['Kelas', 'NISN', 'Nama', 'Tingkat', 'Jurusan', 'Jenis Kelamin', ...statusColumns.map(([, label]) => label), 'Total Catatan'];
    const countByStudent = new Map();
    matchingStudents.forEach(student => countByStudent.set(String(student.nisn), Object.fromEntries(statusColumns.map(([status]) => [status, 0]))));
    reportRows.forEach(row => {
      const counts = countByStudent.get(String(row.nisn));
      if (counts && Object.prototype.hasOwnProperty.call(counts, row.status)) counts[row.status]++;
    });
    const studentRows = matchingStudents.map(student => {
      const counts = countByStudent.get(String(student.nisn));
      const total = statusColumns.reduce((sum, [status]) => sum + counts[status], 0);
      return [student.className || '', student.nisn, student.name, student.grade || '', student.major || '', genderText(student.gender), ...statusColumns.map(([status]) => counts[status]), total];
    });
    const classGroups = new Map();
    matchingStudents.forEach(student => {
      const className = student.className || '(Belum ada kelas)';
      if (!classGroups.has(className)) classGroups.set(className, {students: 0, counts: Object.fromEntries(statusColumns.map(([status]) => [status, 0]))});
      const group = classGroups.get(className);
      group.students++;
      const counts = countByStudent.get(String(student.nisn));
      statusColumns.forEach(([status]) => group.counts[status] += counts[status]);
    });
    const aggregateHeaders = ['Kelas', 'Jumlah Siswa', ...statusColumns.map(([, label]) => label), 'Total Catatan'];
    const classRows = [...classGroups].sort(([a], [b]) => a.localeCompare(b, 'id')).map(([className, group]) => [className, group.students, ...statusColumns.map(([status]) => group.counts[status]), statusColumns.reduce((sum, [status]) => sum + group.counts[status], 0)]);
    const allCounts = Object.fromEntries(statusColumns.map(([status]) => [status, 0]));
    studentRows.forEach((row, index) => statusColumns.forEach(([status], statusIndex) => allCounts[status] += row[6 + statusIndex]));
    const totalRecords = statusColumns.reduce((sum, [status]) => sum + allCounts[status], 0);
    const dailyGroups = new Map();
    const matchingNisns = new Set(matchingStudents.map(student => String(student.nisn)));
    reportRows.forEach(row => {
      if (!matchingNisns.has(String(row.nisn))) return;
      if (row.status === 'Belum absen') return;
      if (!dailyGroups.has(row.date)) dailyGroups.set(row.date, Object.fromEntries(statusColumns.map(([status]) => [status, 0])));
      const counts = dailyGroups.get(row.date);
      if (Object.prototype.hasOwnProperty.call(counts, row.status)) counts[row.status]++;
    });
    const dailyRows = [];
    const startDate = new Date(`${filters.from}T00:00:00Z`), endDate = new Date(`${filters.to}T00:00:00Z`);
    if (!Number.isNaN(startDate.getTime()) && !Number.isNaN(endDate.getTime()) && startDate <= endDate) {
      for (let date = new Date(startDate); date <= endDate; date.setUTCDate(date.getUTCDate() + 1)) {
        const isoDate = date.toISOString().slice(0, 10);
        const counts = dailyGroups.get(isoDate) || Object.fromEntries(statusColumns.map(([status]) => [status, 0]));
        dailyRows.push([isoDate, ...statusColumns.map(([status]) => counts[status]), statusColumns.reduce((sum, [status]) => sum + counts[status], 0)]);
      }
    }
    const sessionDates = [...dailyGroups.keys()].sort();
    const classPresentByDate = new Map();
    const studentByNisn = new Map(matchingStudents.map(student => [String(student.nisn), student]));
    reportRows.forEach(row => {
      if (row.status === 'Belum absen' || !['Hadir', 'Terlambat'].includes(row.status)) return;
      const student = studentByNisn.get(String(row.nisn));
      if (!student) return;
      const className = student.className || '(Belum ada kelas)';
      if (!classPresentByDate.has(row.date)) classPresentByDate.set(row.date, new Map());
      const byClass = classPresentByDate.get(row.date);
      byClass.set(className, (byClass.get(className) || 0) + 1);
    });
    const classAttendanceRows = [...classGroups].map(([className, group]) => {
      const present = group.counts.Hadir + group.counts.Terlambat;
      const eligible = group.students * sessionDates.length;
      return {className, students: group.students, present, eligible, rate: eligible ? present / eligible : null};
    }).sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1) || a.className.localeCompare(b.className, 'id'));
    const distributionRows = matchingStudents.map(student => {
      const counts = countByStudent.get(String(student.nisn));
      const present = counts.Hadir + counts.Terlambat;
      const rate = sessionDates.length ? present / sessionDates.length : null;
      const band = rate === null ? 'Belum ada sesi' : rate <= 0.2 ? '≤20%' : rate <= 0.4 ? '>20–40%' : rate <= 0.6 ? '>40–60%' : rate <= 0.8 ? '>60–80%' : '>80–100%';
      return {student, present, rate, band, row: [student.className || '', student.nisn, student.name, present, sessionDates.length, rate ?? '', band]};
    });
    const distributionBands = ['≤20%', '>20–40%', '>40–60%', '>60–80%', '>80–100%', 'Belum ada sesi'];
    const distributionHistogram = distributionBands.map(band => distributionRows.filter(item => item.band === band).length);
    const compositionRows = [...classGroups].map(([className, group]) => {
      const present = group.counts.Hadir + group.counts.Terlambat;
      const excused = group.counts.Izin;
      const sick = group.counts.Sakit;
      const alpa = group.counts['Tidak Masuk'];
      const other = group.counts['Tidak sholat'] + group.counts.Berhalangan + group.counts['Di luar jadwal'];
      const total = present + excused + sick + alpa + other;
      return {className, present, excused, sick, alpa, other, total};
    });
    const sessionPeriodMap = new Map();
    const rangeDays = (endDate - startDate) / 86400000;
    const trendInterval = rangeDays <= 180 ? 'week' : 'month';
    sessionDates.forEach(dateText => {
      const date = new Date(`${dateText}T00:00:00Z`);
      let key, label;
      if (trendInterval === 'week') {
        date.setUTCDate(date.getUTCDate() - (date.getUTCDay() + 6) % 7);
        key = date.toISOString().slice(0, 10);
        label = `Minggu ${key}`;
      } else {
        key = dateText.slice(0, 7);
        label = key;
      }
      if (!sessionPeriodMap.has(key)) sessionPeriodMap.set(key, {label, sessions: 0});
      sessionPeriodMap.get(key).sessions++;
    });
    const trendPeriods = [...sessionPeriodMap.entries()].map(([key, value]) => ({key, ...value}));
    const classNames = [...classGroups.keys()];
    const gradeNames = [...new Set(matchingStudents.map(student => student.grade || '(Tanpa tingkat)'))];
    const majorNames = [...new Set(matchingStudents.map(student => student.major || '(Tanpa jurusan)'))];
    const trendByClass = classNames.length <= 8;
    const trendDimension = trendByClass ? 'kelas' : gradeNames.length <= majorNames.length ? 'tingkat' : 'jurusan';
    const trendGroups = new Map();
    const trendKeyForStudent = student => trendDimension === 'kelas'
      ? student.className || '(Belum ada kelas)'
      : trendDimension === 'tingkat' ? student.grade || '(Tanpa tingkat)' : student.major || '(Tanpa jurusan)';
    matchingStudents.forEach(student => {
      const key = trendKeyForStudent(student);
      if (!trendGroups.has(key)) trendGroups.set(key, {students: 0, presentByPeriod: new Map()});
      trendGroups.get(key).students++;
    });
    reportRows.forEach(row => {
      if (row.status === 'Belum absen' || !['Hadir', 'Terlambat'].includes(row.status)) return;
      const student = studentByNisn.get(String(row.nisn));
      if (!student) return;
      const date = new Date(`${row.date}T00:00:00Z`);
      if (trendInterval === 'week') date.setUTCDate(date.getUTCDate() - (date.getUTCDay() + 6) % 7);
      const periodKey = trendInterval === 'week' ? date.toISOString().slice(0, 10) : row.date.slice(0, 7);
      const group = trendGroups.get(trendKeyForStudent(student));
      if (group) group.presentByPeriod.set(periodKey, (group.presentByPeriod.get(periodKey) || 0) + 1);
    });
    const trendDatasets = [...trendGroups.entries()].sort(([a], [b]) => a.localeCompare(b, 'id')).map(([label, group], index) => ({
      label,
      data: trendPeriods.map(period => period.sessions ? (group.presentByPeriod.get(period.key) || 0) / (group.students * period.sessions) : null),
      borderColor: ['#176b52', '#d58a32', '#607dca', '#a95c9a', '#45a3a0', '#d55858', '#809549', '#64748b'][index % 8],
      backgroundColor: 'transparent',
      tension: 0.25,
      spanGaps: false
    }));
    const heatmapWeekdayNames = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const heatmapByDate = sessionDates.length <= 31;
    const heatmapLabels = heatmapByDate ? sessionDates : heatmapWeekdayNames;
    const heatmapWeekdaySessions = Array(7).fill(0);
    const heatmapWeekdayPresent = new Map([...classGroups.keys()].map(className => [className, Array(7).fill(0)]));
    sessionDates.forEach(dateText => heatmapWeekdaySessions[new Date(`${dateText}T00:00:00Z`).getUTCDay()]++);
    classPresentByDate.forEach((byClass, dateText) => {
      const weekday = new Date(`${dateText}T00:00:00Z`).getUTCDay();
      byClass.forEach((count, className) => {
        const totals = heatmapWeekdayPresent.get(className);
        if (totals) totals[weekday] += count;
      });
    });
    const heatmapCellValue = (className, label) => {
      const group = classGroups.get(className);
      if (!group || !sessionDates.length) return null;
      if (heatmapByDate) return (classPresentByDate.get(label)?.get(className) || 0) / group.students;
      const weekday = heatmapWeekdayNames.indexOf(label), sessions = heatmapWeekdaySessions[weekday];
      return sessions ? heatmapWeekdayPresent.get(className)[weekday] / (group.students * sessions) : null;
    };

    const workbook = new ExcelJS.Workbook();
    const analysisSheet = workbook.addWorksheet('Analisa Data', {views: [{showGridLines: false}]});
    analysisSheet.columns = Array.from({length: 16}, () => ({width: 12}));
    analysisSheet.mergeCells('A1:P1');

    analysisSheet.getCell('A1').fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF21577A'}};
    analysisSheet.getCell('A1').alignment = {vertical: 'middle'};
    analysisSheet.getRow(1).height = 34;

      {range: 'A4:D4', valueRange: 'A5:D6', label: 'TOTAL CATATAN', value: totalRecords},
      {range: 'E4:H4', valueRange: 'E5:H6', label: 'JUMLAH SISWA', value: matchingStudents.length},
      {range: 'I4:L4', valueRange: 'I5:L6', label: 'HARI ABSENSI', value: sessionDates.length},

    analysisSheet.getRow(4).height = 23;
    analysisSheet.getRow(5).height = 25;
    analysisSheet.getRow(6).height = 22;

    const chartHost = document.createElement('div');
    chartHost.style.cssText = 'position:fixed;left:-12000px;top:0;width:1200px;height:800px;';

          }
        },
        plugins: [...extraPlugins, {
          id: 'whiteBackground',

            context.globalCompositeOperation = 'destination-over';
            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, instance.width, instance.height);
            context.restore();
          }
        }]
      });
      chartInstances.push(chart);
      return chart.toBase64Image();
    };
    const excelColumnName = columnNumber => {
      let name = '';
      while (columnNumber) {
        const remainder = (columnNumber - 1) % 26;
        name = String.fromCharCode(65 + remainder) + name;
        columnNumber = Math.floor((columnNumber - 1) / 26);

    const attendancePercentFormat = value => value === null || value === undefined ? '—' : `${Math.round(value * 100)}%`;

        afterDatasetsDraw(chart) {

      const classComparisonImage = makeChartImage('Persentase Kehadiran per Kelas (urut tertinggi ke terendah)', {
        type: 'bar',
        data: {labels: classAttendanceRows.map(item => item.className), datasets: [{label: 'Persentase hadir', data: classAttendanceRows.map(item => item.rate), backgroundColor: '#287a5c', borderRadius: 4}]},
        options: {
          indexAxis: 'y',
          scales: {x: {min: 0, max: 1, ticks: {callback: attendancePercentFormat}}, y: {ticks: {autoSkip: false}}},
          plugins: {
            legend: {display: false},
            attendanceTargetLine: {value: 0.9},
            tooltip: {callbacks: {label: context => {
              const item = classAttendanceRows[context.dataIndex];
              return item.rate === null ? 'Belum ada sesi' : `${attendancePercentFormat(item.rate)} (${item.present} dari ${item.eligible} kesempatan)`;
            }}}
          }
        }
      }, [targetLinePlugin], classChartHeight);

      const trendImage = makeChartImage(`Tren Persentase Kehadiran per ${periodUnitLabel} · satu garis per ${trendDimension}`, {
        type: 'line',
        data: {labels: trendPeriods.map(period => period.label), datasets: trendDatasets.map(dataset => ({...dataset, pointRadius: 3, borderWidth: 3}))},
        options: {
          scales: {y: {min: 0, max: 1, ticks: {callback: attendancePercentFormat}}, x: {ticks: {maxRotation: 45, minRotation: 0}}},
          plugins: {tooltip: {callbacks: {label: context => `${context.dataset.label}: ${attendancePercentFormat(context.parsed.y)}`}}}
        }
      });

      const distributionImage = makeChartImage('Distribusi Persentase Kehadiran Siswa', {
        type: 'bar',
        data: {labels: distributionBands, datasets: [{label: 'Jumlah siswa', data: distributionHistogram, backgroundColor: ['#b64343', '#d27640', '#d7aa45', '#80a75a', '#287a5c', '#9aa3aa'], borderRadius: 5}]},
        options: {scales: {y: {beginAtZero: true, ticks: {precision: 0}}, x: {ticks: {maxRotation: 0}}}, plugins: {legend: {display: false}}}
      });

      const compositionSeries = [
        {label: 'Hadir (termasuk terlambat)', color: '#287a5c', value: item => item.present},
        {label: 'Izin', color: '#557eaa', value: item => item.excused},
        {label: 'Sakit', color: '#8d6eab', value: item => item.sick},
        {label: 'Alpa (Tidak Masuk)', color: '#c85850', value: item => item.alpa},
        {label: 'Status lainnya', color: '#d59b3a', value: item => item.other}
      ];
      const compositionChartHeight = Math.max(540, compositionRows.length * 32);
      const compositionChartRows = Math.ceil(compositionChartHeight / 32);
      const compositionImage = makeChartImage('Komposisi Status per Kelas (persentase dari catatan)', {
        type: 'bar',
        data: {
          labels: compositionRows.map(item => item.className),
          datasets: compositionSeries.map(series => ({
            label: series.label,
            backgroundColor: series.color,
            data: compositionRows.map(item => item.total ? series.value(item) / item.total : 0),
            borderRadius: 3
          }))
        },
        options: {
          indexAxis: 'y',
          scales: {x: {stacked: true, min: 0, max: 1, ticks: {callback: attendancePercentFormat}}, y: {stacked: true, ticks: {autoSkip: false}}},
          plugins: {tooltip: {callbacks: {label: context => `${context.dataset.label}: ${attendancePercentFormat(context.parsed.x)}`}}}
        }
      }, [], compositionChartHeight);

      let nextChartRow = 8;
      [
        {image: classComparisonImage, rows: classChartRows},
        {image: trendImage, rows: 17},
        {image: distributionImage, rows: 17},
        {image: compositionImage, rows: compositionChartRows}
      ].forEach(section => {
        const lastRow = nextChartRow + section.rows - 1;
        for (let row = nextChartRow; row <= lastRow; row++) analysisSheet.getRow(row).height = 24;
        const imageId = workbook.addImage({base64: section.image, extension: 'png'});
        analysisSheet.addImage(imageId, `A${nextChartRow}:P${lastRow}`);
        nextChartRow = lastRow + 2;
      });

      const heatmapTitleRow = nextChartRow;
      const heatmapHeaderRow = heatmapTitleRow + 1;
      const heatmapEndColumn = heatmapHeaders.length;
      const heatmapEndRow = heatmapHeaderRow + heatmapRows.length;
      analysisSheet.mergeCells(`A${heatmapTitleRow}:${excelColumnName(heatmapEndColumn)}${heatmapTitleRow}`);
      const heatmapTitle = analysisSheet.getCell(`A${heatmapTitleRow}`);
      heatmapTitle.value = 'Pola Kehadiran menurut Kelas dan Hari';
      heatmapTitle.font = {bold: true, size: 14, color: {argb: 'FFFFFFFF'}};
      heatmapTitle.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF21577A'}};
      heatmapTitle.alignment = {vertical: 'middle'};
      analysisSheet.getRow(heatmapTitleRow).height = 28;
      const heatmapHeader = analysisSheet.getRow(heatmapHeaderRow);
      heatmapHeaders.forEach((header, index) => {
        const cell = heatmapHeader.getCell(index + 1);
        cell.value = header;
        cell.font = {bold: true, color: {argb: 'FFFFFFFF'}};
        cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF21577A'}};
        cell.alignment = {horizontal: 'center', vertical: 'middle', wrapText: true};
      });
      heatmapRows.forEach((row, rowIndex) => {
        const excelRow = analysisSheet.getRow(heatmapHeaderRow + rowIndex + 1);
        row.forEach((value, columnIndex) => {
          const cell = excelRow.getCell(columnIndex + 1);
          cell.value = value;
          if (columnIndex > 0 && typeof value === 'number') {
            cell.numFmt = '0%';
            const color = value >= 0.9 ? 'FF4E9A67' : value >= 0.75 ? 'FFB8D9A8' : value >= 0.5 ? 'FFFFE69A' : 'FFF0A09A';
            cell.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: color}};
            cell.alignment = {horizontal: 'center'};
          }
        });
      });
      const noteRow = heatmapEndRow + 2;
      analysisSheet.mergeCells(`A${noteRow}:${excelColumnName(Math.max(16, heatmapEndColumn))}${noteRow + 1}`);
      const analysisNote = analysisSheet.getCell(`A${noteRow}`);
      analysisNote.value = `Definisi: hadir = Hadir + Terlambat; persentase kehadiran memakai seluruh siswa aktif × hari absensi yang tercatat (${sessionDates.length} hari). Target grafik 90%. Tren memakai minggu untuk rentang ≤180 hari, selain itu per bulan; bila kelas lebih dari 8, garis digabung per ${trendDimension}. Heatmap menampilkan tanggal untuk ≤31 hari absensi, selain itu rata-rata per hari dalam seminggu. Alpa = Tidak Masuk; Tidak Sholat, Berhalangan, dan Di Luar Jadwal ditampilkan sebagai Status lainnya.`;
      analysisNote.alignment = {wrapText: true, vertical: 'middle'};
      analysisNote.font = {italic: true, size: 10, color: {argb: 'FF52616B'}};
      analysisSheet.getRow(noteRow).height = 28;
      analysisSheet.getRow(noteRow + 1).height = 28;
    } finally {
      chartInstances.forEach(chart => chart.destroy());
      chartHost.remove();
    }

    let tableIndex = 0;
    const addSheet = (name, columns, rows, widths) => {
      const sheet = workbook.addWorksheet(name, {views: [{state: 'frozen', ySplit: 1}]});
      sheet.columns = widths.map(width => ({width}));
      if (rows.length) {
        tableIndex++;
        sheet.addTable({
          name: `AbsensiTable${tableIndex}`,
          ref: 'A1',
          headerRow: true,
          style: {theme: 'TableStyleMedium2', showRowStripes: true},
          columns: columns.map(column => ({name: column})),
          rows
        });
      } else {
        const header = sheet.addRow(columns);
        header.font = {bold: true, color: {argb: 'FFFFFFFF'}};
        header.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF21577A'}};
        sheet.autoFilter = {from: 'A1', to: `${String.fromCharCode(64 + columns.length)}1`};
      }
      return sheet;
    };
    const studentWidths = [14, 16, 32, 10, 18, 17, ...statusColumns.map(() => 15), 16];
    const summaryRows = [
      ['Tanggal Mulai', filters.from], ['Tanggal Akhir', filters.to],
      ['Tingkat', filters.grade || 'Semua'], ['Jurusan', filters.major || 'Semua'],
      ['Kelas', filters.className || 'Semua'], ['Jumlah Siswa', matchingStudents.length],
      ['Total Catatan', totalRecords], ...statusColumns.map(([status, label]) => [label, allCounts[status]])
    ];
    addSheet('Ringkasan', ['Informasi', 'Nilai'], summaryRows, [24, 28]);
    addSheet('Rekap Per Siswa', headers, studentRows, studentWidths);
    const distributionSheet = addSheet('Distribusi Siswa', ['Kelas', 'NISN', 'Nama', 'Hadir/Terlambat', 'Jumlah Sesi', 'Persentase Hadir', 'Kategori'], distributionRows.map(item => item.row), [18, 16, 32, 18, 15, 18, 18]);
    distributionSheet.getColumn(6).numFmt = '0.0%';
    addSheet('Ringkasan Kelas', aggregateHeaders, classRows, [20, 16, ...statusColumns.map(() => 15), 16]);
    addSheet('Rekap Status', ['Status', 'Total Catatan'], statusColumns.map(([status, label]) => [label, allCounts[status]]), [22, 18]);

    addSheet('Rekap Harian', ['Tanggal', ...statusColumns.map(([, label]) => label), 'Total Catatan'], dailyRows, [16, ...statusColumns.map(() => 15), 16]);

    const usedNames = new Set(workbook.worksheets.map(sheet => sheet.name.toLowerCase()));
    const safeSheetName = value => {
      const base = String(value || 'Tanpa Kelas').replace(/[:\\/?*\[\]]/g, ' ').trim().replace(/^'+|'+$/g, '').slice(0, 31) || 'Tanpa Kelas';
      let name = base, suffix = 2;
      while (usedNames.has(name.toLowerCase())) {
        const ending = ` (${suffix++})`;
        name = `${base.slice(0, 31 - ending.length)}${ending}`;
      }
      usedNames.add(name.toLowerCase());
      return name;
    };
    [...classGroups.keys()].sort((a, b) => a.localeCompare(b, 'id')).forEach(className => {
      const rows = matchingStudents.filter(student => (student.className || '(Belum ada kelas)') === className).map(student => {
        const counts = countByStudent.get(String(student.nisn));
        const total = statusColumns.reduce((sum, [status]) => sum + counts[status], 0);
        return [className, student.nisn, student.name, student.grade || '', student.major || '', genderText(student.gender), ...statusColumns.map(([status]) => counts[status]), total];
      });
      addSheet(safeSheetName(className), headers, rows, studentWidths);
    });

    const buffer = await workbook.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buffer], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = `hitung-absensi-${filters.from}-sd-${filters.to}.xlsx`;
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (error) {
    fail(error);
  } finally {
    if (downloadButton?.isConnected) {
      downloadButton.disabled = false;
      downloadButton.textContent = '↓ Unduh hitung absensi (.xlsx)';
    }
  }
}

function downloadReport() {
  if(!state.report) {
    toast('Rekap sedang dimuat. Coba unduh kembali sebentar lagi.');
    return
      }
  const rows=state.report,cols=['Tanggal','NISN','Nama','Jenis Kelamin','Tingkat','Jurusan','Kelas','Status','Waktu','Catatan','Petugas'];
  const csv=[cols,...rows.map(r=>[r.date,r.nisn,r.studentName,r.gender,r.grade,r.major,r.className,r.status,r.time,r.note,r.recordedBy])].map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');

    const a=document.createElement('a');

    a.href=URL.createObjectURL(new Blob(['\ufeff'+csv], {
    type:'text/csv;charset=utf-8'
      }
  ));

    a.download='rekap-absensi-'+($('#from').value||'')+'-sd-'+($('#to').value||'')+'.csv';

    a.click();

    URL.revokeObjectURL(a.href)
  }

function drawQR() {
  const q=($('#qrsearch')?.value||'').toLowerCase(),g=$('#qrgrade')?.value,m=$('#qrmajor')?.value;

    const rows=state.students.filter(s=>(`${s.name} ${s.nisn}`).toLowerCase().includes(q)&&(!g||s.grade===g)&&(!m||s.major===m));

    $('#qrgrid').innerHTML=rows.map((s,i)=>`<div class="qritem">
<div id="qr${i}">
</div>
<b>${esc(s.name)}</b>
<small>${esc(s.nisn)} · ${esc(genderText(s.gender))} · ${esc(s.grade)} ${esc(s.className)}</small>
<button class="btn small secondary" onclick="saveQR('qr${i}','${esc(s.nisn)}')">Unduh QR</button>
</div>`).join('')||'<div class="empty">Tidak ada siswa yang cocok.</div>';

    rows.forEach((s,i)=>new QRCode($('#qr'+i), {
    text:String(s.nisn),width:128,height:128,colorDark:'#17231f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M
      }
  ))
  }

function saveQR(id,nisn) {
  const box=$('#'+id),img=box.querySelector('img'),canvas=box.querySelector('canvas');

    const url=img?.src||canvas?.toDataURL('image/png');

    if(!url)return;

    const a=document.createElement('a');

    a.href=url;

    a.download='kartu-qr-'+nisn+'.png';

    a.click()
  }

document.addEventListener('click', event => {
  const side = $('#side');
  const menuButton = $('#menubtn');
  const isMobile = window.matchMedia('(max-width: 900px)').matches;

  if (
    isMobile &&
    side?.classList.contains('open') &&
    !side.contains(event.target) &&
    !menuButton?.contains(event.target)
  ) {
    side.classList.remove('open');
  }
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    $('#side')?.classList.remove('open');
  }
});

init();
</script>
</body>
</html>
